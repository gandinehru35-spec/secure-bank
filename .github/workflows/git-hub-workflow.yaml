name: Build and Deploy SecureBank Service

# Trigger this workflow on a push to the 'master' branch
on:
  push:
    branches: [ "master" ]

# Grant permissions for the OIDC token and for writing content
permissions:
  contents: read
  id-token: write

# Environment variables available to all jobs
env:
  PROJECT_ID: "alpine-anvil-473102-c4"
  PROJECT_NUMBER: "1039471930533" # From your earlier logs
  GKE_CLUSTER: "gke-securebank-prod"
  GKE_REGION: "us-central1"
  ARTIFACT_REGISTRY: "securebank-docker-repo"
  SERVICE_NAME: "auth-service"
  # Set your Bastion/Home IP here
  BASTION_IP: "174.91.157.19/32" 

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository's code
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Authenticate to Google Cloud using OIDC
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "gsa-github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

    # 3. Set up the Google Cloud SDK and install the GKE auth plugin
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: 'gke-gcloud-auth-plugin'

    # 4. Get the runner's IP and ADD it to the firewall list
    - name: Authorize GitHub Runner IP
      id: get_ip
      run: |
        export RUNNER_IP=$(curl -s ifconfig.me)/32
        echo "Runner IP is $RUNNER_IP"
        # This command REPLACES the list with the Bastion IP AND the Runner IP
        gcloud container clusters update ${{ env.GKE_CLUSTER }} \
          --region ${{ env.GKE_REGION }} \
          --enable-master-authorized-networks \
          --master-authorized-networks ${{ env.BASTION_IP }},$RUNNER_IP
        # Set the IP as an output so the cleanup step can use it
        echo "runner_ip=$RUNNER_IP" >> $GITHUB_OUTPUT

    # 5. Build the Docker image
    - name: Build Docker image
      run: |
        export SHORT_SHA=$(git rev-parse --short HEAD)
        docker build -t $SERVICE_NAME \
          --build-arg IMAGE_REPO="us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$SERVICE_NAME" \
          --build-arg IMAGE_TAG=$SHORT_SHA \
          ./auth-service

    # 6. Configure Docker to authenticate with Artifact Registry
    - name: Configure Docker
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    # 7. Push the Docker image to Artifact Registry
    - name: Push Docker image
      run: |
        export SHORT_SHA=$(git rev-parse --short HEAD)
        export IMAGE_REPO="us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$SERVICE_NAME"
        
        docker tag $SERVICE_NAME $IMAGE_REPO:$SHORT_SHA
        docker tag $SERVICE_NAME $IMAGE_REPO:latest
        
        docker push $IMAGE_REPO:$SHORT_SHA
        docker push $IMAGE_REPO:latest

    # 8. Get GKE credentials
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
          --region ${{ env.GKE_REGION }}

    # 9. Wait for firewall rule to update
    - name: Wait for GKE firewall update
      run: sleep 60 # 60 seconds should be enough for the update

    # 10. Deploy the application to GKE using Helm
    - name: Deploy with Helm
      run: |
        export IMAGE_REPO="us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$SERVICE_NAME"
        export SHORT_SHA=$(git rev-parse --short HEAD)
        
        helm upgrade --install auth-service ./helm \
          --set image.repository=$IMAGE_REPO \
          --set image.tag=$SHORT_SHA \
          --set global.projectId=$PROJECT_ID \
          --namespace default
          
    # --- THIS IS THE CORRECTED CLEANUP STEP ---
    # 11. Remove the runner's IP from the firewall
    - name: Remove GitHub Runner from Firewall
      # This 'if' condition ensures this step runs even if the deploy fails
      if: always()
      run: |
        echo "Cleaning up firewall. Setting authorized networks back to Bastion IP."
        gcloud container clusters update ${{ env.GKE_CLUSTER }} \
          --region ${{ env.GKE_REGION }} \
          --enable-master-authorized-networks \
          --master-authorized-networks ${{ env.BASTION_IP }}

