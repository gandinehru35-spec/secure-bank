name: Build and Deploy SecureBank Service

# Trigger this workflow on a push to the 'master' branch
on:
  push:
    branches: [ "master" ]

# Grant permissions for the OIDC token and for writing content
permissions:
  contents: read
  id-token: write

# Environment variables available to all jobs
env:
  PROJECT_ID: "alpine-anvil-473102-c4"
  PROJECT_NUMBER: "1039471930533" # From your earlier logs
  GKE_CLUSTER: "gke-securebank-prod"
  GKE_REGION: "us-central1"
  ARTIFACT_REGISTRY: "securebank-docker-repo"
  SERVICE_NAME: "auth-service"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository's code
    - name: Check out repository
      uses: actions/checkout@v4

    # 2. Authenticate to Google Cloud using OIDC
    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "gsa-github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

    # 3. Set up the Google Cloud SDK and install the GKE auth plugin
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        install_components: 'gke-gcloud-auth-plugin'

    # 4. Build the Docker image
    - name: Build Docker image
      run: |
        export SHORT_SHA=$(git rev-parse --short HEAD)
        docker build -t $SERVICE_NAME \
          --build-arg IMAGE_REPO="us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$SERVICE_NAME" \
          --build-arg IMAGE_TAG=$SHORT_SHA \
          ./app

    # 5. Configure Docker to authenticate with Artifact Registry
    - name: Configure Docker
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    # 6. Push the Docker image to Artifact Registry
    - name: Push Docker image
      run: |
        export SHORT_SHA=$(git rev-parse --short HEAD)
        export IMAGE_REPO="us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$SERVICE_NAME"
        
        docker tag $SERVICE_NAME $IMAGE_REPO:$SHORT_SHA
        docker tag $SERVICE_NAME $IMAGE_REPO:latest
        
        docker push $IMAGE_REPO:$SHORT_SHA
        docker push $IMAGE_REPO:latest

    # 7. Get GKE credentials (and update firewall)
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
          --region ${{ env.GKE_REGION }}

    # 8. Wait for firewall rule to update
    # --- THIS IS THE FIX ---
    # Increased wait time from 60 to 120 seconds
    - name: Wait for GKE firewall update
      run: sleep 180

    # 9. Deploy the application to GKE using Helm
    - name: Deploy with Helm
      run: |
        export IMAGE_REPO="us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REGISTRY/$SERVICE_NAME"
        export SHORT_SHA=$(git rev-parse --short HEAD)
        
        helm upgrade --install auth-service ./helm \
          --set image.repository=$IMAGE_REPO \
          --set image.tag=$SHORT_SHA \
          --set global.projectId

