apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-deployment
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      # CRITICAL: Link the Kubernetes Service Account (KSA) to the pod
      serviceAccountName: ksa-auth
      
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: Always
        
        # NOTE: Your Python app is listening on 5000
        ports:
        - containerPort: 5000
        
        # Health Checks
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          timeoutSeconds: 1
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 10

        # --- CSI Driver Volume Mount ---
        volumeMounts:
        - name: secret-volume
          mountPath: /mnt/secrets/
          readOnly: true

      # --- CSI Driver Volume Definition ---
      volumes:
      - name: secret-volume
        csi:
          # FIX: This driver name is specific to the GKE-managed Secret Manager
          driver: gcp-secret-manager
          readOnly: true
          volumeAttributes:
            secretProviderClass: auth-redis-secrets