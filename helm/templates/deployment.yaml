apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      # --- THIS IS THE FIX ---
      # This tells the pod to use the KSA we created
      serviceAccountName: ksa-auth
      # ---------------------
      containers:
        - name: auth-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000 # This must match the port in your app.py
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: secret-volume
              mountPath: "/mnt/secrets"
              readOnly: true
      volumes:
        - name: secret-volume
          csi:
            # --- THIS IS THE FIX ---
            # Use the GKE-managed driver name
            driver: secrets.gke.io
            # ---------------------
            readOnly: true
            volumeAttributes:
              # This links to our SecretProviderClass
              secretProviderClass: "auth-redis-secrets"

